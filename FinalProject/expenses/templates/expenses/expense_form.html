{% extends 'expenses/base.html' %}
{% block content %}
  <h2>New Expense for {{ group.name }}</h2>
  <form method="post">{% csrf_token %}
    <label>Title<br><input name="title"></label><br>
    <label>Amount<br><input name="amount" type="number" step="0.01"></label><br>
    <label>Date<br><input name="date" type="date"></label><br>
    <label>Paid by<br>
      <select name="paid_by">
        {% for m in group.members.all %}
          <option value="{{ m.id }}">{{ m.display_name }}</option>
        {% endfor %}
      </select>
    </label><br>
    <button type="submit">Create</button>
  </form>
{% endblock %}
